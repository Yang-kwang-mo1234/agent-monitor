<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f6f5; --card: #ffffff; --border: #e8e8e6; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.07);
  --text: #18181a; --muted: #85858a; --faint: #b3b3b6; --chip: #f1f1f0; --chip-hover: #e8e8e6; --row: #f2f2f1;
  --seg: #ebebea; --seg-hover: #d6d6d4;
  --blue: #2f62d9; --blue-bg: #e9f0fd; --blue-seg: #9fbaf2; --blue-seg2: #d6e3fb;
  --green: #23874d; --green-bg: #e5f4ea; --amber: #a26a10; --amber-bg: #fcf1dc; --red: #c43b3b; --red-bg: #fbe8e8;
  --accent: #d97757; --tip: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1d20; --card: #1f1f22; --border: #303035; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --text: #ececee; --muted: #8c8c93; --faint: #5c5c62; --chip: #2a2a2e; --chip-hover: #34343a; --row: #18181b;
    --seg: #303035; --seg-hover: #4a4a50;
    --blue: #7ea2f5; --blue-bg: #1f2a45; --blue-seg: #4c6fbf; --blue-seg2: #2a3a63;
    --green: #6cc98f; --green-bg: #1e3426; --amber: #e3b25c; --amber-bg: #3a2e17; --red: #f08a8a; --red-bg: #3d2020;
    --tip: #26262a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1d20; --card: #1f1f22; --border: #303035; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --text: #ececee; --muted: #8c8c93; --faint: #5c5c62; --chip: #2a2a2e; --chip-hover: #34343a; --row: #18181b;
  --seg: #303035; --seg-hover: #4a4a50;
  --blue: #7ea2f5; --blue-bg: #1f2a45; --blue-seg: #4c6fbf; --blue-seg2: #2a3a63;
  --green: #6cc98f; --green-bg: #1e3426; --amber: #e3b25c; --amber-bg: #3a2e17; --red: #f08a8a; --red-bg: #3d2020;
  --tip: #26262a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.35 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0;
  transition: background .3s;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
.top {
  position: fixed; inset: 0 0 auto 0; display: flex; gap: 8px; align-items: center; justify-content: space-between;
  padding: 14px 16px; font-size: 12px; color: var(--muted);
}
.top select, .top button {
  font: inherit; color: var(--muted); background: transparent; border: 1px solid var(--border);
  border-radius: 8px; padding: 5px 8px; max-width: 60vw;
}
.top .brand { display: flex; align-items: center; gap: 6px; font-weight: 500; }
.stage { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; padding: 72px 16px 40px; }
.top .brand { white-space: nowrap; }

.card {
  width: 384px; max-width: 100%; background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; box-shadow: var(--shadow); padding: 16px; position: relative;
  transition: width .35s cubic-bezier(.2,.8,.2,1), border-radius .35s, padding .35s, background .3s;
}
.card.collapsed { width: auto; border-radius: 999px; padding: 8px 10px 8px 8px; cursor: pointer; }

.logo {
  width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border); display: grid; place-items: center;
  flex: none; background: var(--card);
}
.logo svg { width: 18px; height: 18px; }
.logo.spin svg { animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.head { display: flex; align-items: center; gap: 10px; }
.titles { min-width: 0; flex: 1; }
.model { font-weight: 500; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cost { font-variant-numeric: tabular-nums; font-size: 13.5px; color: var(--text); }
.cost .tail { color: var(--faint); transition: color .4s; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 7px;
  font-size: 13px; font-weight: 500; white-space: nowrap;
}
.pill i { width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
.pill.running, .pill.pausing, .pill.cancelling { color: var(--blue); background: var(--blue-bg); }
.pill.running i { animation: pulse 1.4s ease-in-out infinite; }
.pill.finished { color: var(--green); background: var(--green-bg); }
.pill.paused, .pill.waiting, .pill.interrupted { color: var(--amber); background: var(--amber-bg); }
.pill.cancelled, .pill.failed { color: var(--red); background: var(--red-bg); }
.pill.idle, .pill.empty { color: var(--muted); background: var(--chip); }
@keyframes pulse { 50% { opacity: .35; } }
.iconbtn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; color: var(--faint); }
.iconbtn:hover { background: var(--chip); color: var(--muted); }

.now {
  margin-top: 14px; display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 10px;
  background: var(--row); border-radius: 12px; min-height: 48px;
}
.now .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.now .label small { font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 13.5px; }
.now .timer { font-variant-numeric: tabular-nums; color: var(--muted); }
.shimmer {
  background: linear-gradient(90deg, var(--text) 0%, var(--text) 40%, var(--faint) 50%, var(--text) 60%, var(--text) 100%);
  background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 2.2s linear infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }

.ico {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--card);
  display: grid; place-items: center; flex: none; color: var(--text);
}
.ico svg { width: 16px; height: 16px; }
.ico.sm { width: 24px; height: 24px; border-radius: 7px; }
.ico.sm svg { width: 13px; height: 13px; }

.bar { display: flex; gap: 4px; margin: 14px 0 6px; height: 14px; align-items: center; position: relative; }
.seg {
  height: 6px; border-radius: 4px; background: var(--seg); min-width: 10px; flex-basis: 0;
  transition: flex-grow .5s cubic-bezier(.2,.8,.2,1), background .2s, height .15s; cursor: pointer;
}
.seg:hover, .seg.hl { background: var(--seg-hover); height: 7px; }
.seg.fail { background: var(--red-bg); }
.seg.live {
  background: linear-gradient(90deg, var(--blue-seg2), var(--blue-seg) 60%, var(--blue-seg2));
  background-size: 200% 100%; animation: flow 1.6s linear infinite;
}
@keyframes flow { from { background-position: 200% 0; } to { background-position: 0 0; } }
.bar.empty .seg { background: var(--seg); }

.hist { list-style: none; margin: 6px 0 0; padding: 0; }
.hist li {
  display: flex; align-items: center; gap: 10px; padding: 6px 8px; margin: 0 -2px; border-radius: 9px;
  color: var(--muted); transition: background .15s, color .15s, opacity .3s;
  animation: slidein .35s cubic-bezier(.2,.8,.2,1) both;
}
.hist li:nth-child(2) { opacity: .8; } .hist li:nth-child(3) { opacity: .55; }
.hist li.hl { background: var(--row); color: var(--text); opacity: 1; }
.hist .l { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hist .d { font-variant-numeric: tabular-nums; color: var(--faint); font-size: 13px; }
.hist .x { color: var(--red); font-size: 12px; }
@keyframes slidein { from { transform: translateY(-6px); opacity: 0; } }

.foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 9px;
  background: var(--chip); font-weight: 500; font-size: 13.5px;
}
.btn:hover { background: var(--chip-hover); }
.btn svg { width: 11px; height: 11px; color: var(--muted); }
.btn:disabled { opacity: .5; cursor: default; }
.foot .sp { flex: 1; }
.foot .count { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 13px; margin-right: 6px; }
.foot .log { color: var(--muted); display: inline-flex; gap: 4px; align-items: center; font-weight: 500; padding: 6px 4px; }
.foot .log:hover { color: var(--text); }

.tip {
  position: absolute; z-index: 5; pointer-events: none; background: var(--tip); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); padding: 8px 12px; white-space: nowrap;
  transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .12s;
}
.tip.on { opacity: 1; }
.tip b { display: block; font-weight: 500; }
.tip span { color: var(--muted); font-size: 12.5px; }

/* collapsed pill */
.mini { display: flex; align-items: center; gap: 10px; }
.mini .model { margin-right: 6px; }
.stack { display: flex; align-items: center; padding-left: 8px; }
.stack .ico { margin-left: -9px; width: 28px; height: 28px; box-shadow: 0 0 0 2px var(--card); transition: transform .15s, margin .2s; }
.stack .ico:hover { transform: translateY(-3px); }
.stack .ico.old { color: var(--faint); }
.mini .timer { font-variant-numeric: tabular-nums; color: var(--text); margin: 0 6px 0 4px; }
.mini .dot { width: 7px; height: 7px; border-radius: 2px; flex: none; }

/* log drawer */
.drawer {
  position: fixed; inset: 0; background: rgba(0,0,0,.25); display: none; align-items: flex-end; justify-content: center; z-index: 10;
}
.drawer.on { display: flex; }
.drawer .panel {
  width: 560px; max-width: 100%; max-height: 80vh; overflow: auto; background: var(--card); border: 1px solid var(--border);
  border-radius: 16px 16px 0 0; padding: 18px 18px 28px; box-shadow: var(--shadow); animation: up .25s cubic-bezier(.2,.8,.2,1);
}
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; }
.panel .prompt { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.panel .row { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); font-size: 13px; }
.panel .row .t { width: 44px; color: var(--faint); font-variant-numeric: tabular-nums; }
.panel .row .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panel .row .err { color: var(--red); font-size: 12px; }
.panel a { color: var(--blue); font-size: 12.5px; text-decoration: none; }

.empty-note { text-align: center; color: var(--muted); padding: 10px 0 2px; font-size: 13px; }
.empty-note code { background: var(--chip); padding: 1px 5px; border-radius: 5px; }

@media (max-width: 420px) {
  .card { padding: 14px; }
  .cost { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span id="brandlogo"></span>Agent Monitor</div>
  <div style="display:flex;gap:6px">
    <select id="sessions" aria-label="Session"><option value="">Follow latest session</option></select>
    <button id="theme" title="Toggle theme">◐</button>
  </div>
</div>
<div class="stage"><div id="card" class="card"></div></div>
<div id="drawer" class="drawer"><div class="panel" id="panel"></div></div>

<script>
const ICONS = {
  claude: '<svg viewBox="0 0 24 24" fill="none" stroke="#d97757" stroke-width="2.1" stroke-linecap="round">' +
    Array.from({ length: 12 }, (_, i) => { const a = i * Math.PI / 6, r1 = 2.2, r2 = i % 2 ? 9 : 10.5;
      return `<line x1="${12 + r1 * Math.cos(a)}" y1="${12 + r1 * Math.sin(a)}" x2="${12 + r2 * Math.cos(a)}" y2="${12 + r2 * Math.sin(a)}"/>`; }).join('') + '</svg>',
  terminal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="m7.5 10 2.5 2-2.5 2M12.5 15h4"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>',
  web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.6 2.6 14.4 0 17M12 3.5c-2.6 2.6-2.6 14.4 0 17"/></svg>',
  github: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="6" r="2.2"/><circle cx="7" cy="18" r="2.2"/><circle cx="17" cy="8" r="2.2"/><path d="M7 8.2v7.6M17 10.2c0 4-6 3-9 6"/></svg>',
  notion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M5 4.5 15.5 3.5 19 6v14l-11 .8L5 18z"/><path d="M9 8.5v8M9 8.5l6 8M15 8v8.5" stroke-linecap="round"/></svg>',
  slack: '<svg viewBox="0 0 24 24" stroke-width="3.2" stroke-linecap="round"><path d="M9.5 4v7" stroke="#36c5f0"/><path d="M20 9.5h-7" stroke="#2eb67d"/><path d="M14.5 20v-7" stroke="#ecb22e"/><path d="M4 14.5h7" stroke="#e01e5a"/></svg>',
  linear: '<svg viewBox="0 0 24 24" fill="none" stroke="#5e6ad2" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M5 14.5 9.5 19M4.2 10.5l9.3 9.3M6.2 6.6l11.2 11.2M10 4.2l9.8 9.8"/></svg>',
  agent: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m4 7 1.5 1.5L8 6M4 13l1.5 1.5L8 12M11 7h9M11 13h9M11 19h9"/></svg>',
  skill: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg>',
  plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg>',
  tool: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0 5 5L13 18l-3 3-4-4 3-3 6.5-6.5a4 4 0 0 1-1-1z"/></svg>',
  pause: '<svg viewBox="0 0 12 12" fill="currentColor"><rect x="3" y="2" width="1.8" height="8" rx=".6"/><rect x="7.2" y="2" width="1.8" height="8" rx=".6"/></svg>',
  play: '<svg viewBox="0 0 12 12" fill="currentColor"><path d="M3.5 2.2v7.6L9.7 6z"/></svg>',
  x: '<svg viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m3 3 6 6M9 3 3 9"/></svg>',
  arrow: '<svg viewBox="0 0 12 12" width="11" height="11" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"><path d="M4 8 8.5 3.5M5 3.5h3.5V7"/></svg>',
  collapse: '<svg viewBox="0 0 16 16" width="14" height="14" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 3 3 3-3M5 13l3-3 3 3"/></svg>',
};
const STATUS = {
  running: 'Running', pausing: 'Pausing', cancelling: 'Cancelling', paused: 'Paused', waiting: 'Needs you',
  finished: 'Finished', cancelled: 'Cancelled', failed: 'Failed', interrupted: 'Interrupted', idle: 'Idle', empty: 'Idle',
};

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ico = (k, cls = '') => `<span class="ico ${cls}">${ICONS[k] || ICONS.tool}</span>`;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

let S = null, skew = 0, es = null, shownCost = 0, costFrom = 0, costTo = 0, costT0 = 0;
let collapsed = store.get('am.collapsed') === '1';
let chosen = '';

const now = () => Date.now() - skew;
const clock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const dur = (ms) => ms < 60000 ? (ms / 1000).toFixed(1) + 's' : clock(ms);
const human = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? s + 's' : `${Math.floor(s / 60)}m ${s % 60}s`; };
const live = () => S && S.steps.find((x) => x.end == null);
const ended = () => ['finished', 'cancelled', 'failed', 'interrupted'].includes(S.status);
const runMs = () => S && S.startedAt ? (S.endedAt || now()) - S.startedAt : 0;
const stepMs = (s) => (s.end || now()) - s.start;

function connect() {
  if (es) es.close();
  es = new EventSource('/events' + (chosen ? '?session=' + encodeURIComponent(chosen) : ''));
  es.addEventListener('state', (e) => {
    const prevCost = S && S.cost;
    S = JSON.parse(e.data);
    skew = Date.now() - S.now;
    if (S.cost != null && S.cost !== prevCost) { costFrom = shownCost || 0; costTo = S.cost; costT0 = performance.now(); }
    if (S.cost == null) { shownCost = 0; costTo = 0; }
    render();
  });
}

async function loadSessions() {
  try {
    const list = await (await fetch('/api/sessions')).json();
    const sel = $('#sessions');
    const keep = sel.value;
    sel.innerHTML = '<option value="">Follow latest session</option>' + list.map((x) =>
      `<option value="${esc(x.id)}">${esc(x.project || 'session')} · ${esc((x.prompt || x.id).slice(0, 40))} · ${esc(STATUS[x.status] || x.status)}</option>`).join('');
    sel.value = keep;
  } catch {}
}

function costHTML(v) {
  const t = v.toFixed(3), cut = t.length - 1;
  return `$${t.slice(0, cut)}<span class="tail">${t.slice(cut)}</span>`;
}

function render() {
  const card = $('#card');
  if (!S) return;
  card.classList.toggle('collapsed', collapsed);
  card.innerHTML = collapsed ? miniHTML() : fullHTML();
  bind();
  tick();
}

function subline() {
  const bits = [S.project, S.prompt].filter(Boolean);
  return esc(bits.join(' · ') || 'Claude Code');
}

function fullHTML() {
  if (S.status === 'empty') {
    return `<div class="head"><span class="logo">${ICONS.claude}</span><div class="titles"><div class="model">Agent Monitor</div><div class="sub">Waiting for Claude Code</div></div><span class="pill idle"><i></i>Idle</span></div>
      <div class="empty-note">No runs recorded yet. Start a new Claude Code session and send a prompt.</div>`;
  }
  const L = live();
  const done = S.steps.filter((x) => x.end != null);
  const running = !ended() && S.status !== 'idle';
  let nowRow;
  if (ended()) {
    const word = { finished: 'Finished', cancelled: 'Cancelled', failed: 'Failed', interrupted: 'Interrupted' }[S.status];
    const fails = done.filter((x) => x.ok === false).length;
    nowRow = `<div class="now"><span class="label">${word} in ${human(runMs())}<small>${S.steps.length} step${S.steps.length === 1 ? '' : 's'}${fails ? ` · ${fails} failed` : ''}${S.error ? ` · ${esc(S.error.replace(/_/g, ' '))}` : ''}</small></span></div>`;
  } else if (S.status === 'idle') {
    nowRow = `<div class="now">${ico('claude')}<span class="label" style="color:var(--muted)">Waiting for a prompt</span></div>`;
  } else {
    let label, icon = 'claude', shim = true;
    if (S.status === 'paused') { label = 'Paused before the next step'; shim = false; icon = L ? L.icon : 'claude'; }
    else if (S.status === 'pausing') label = 'Pausing before the next step…';
    else if (S.status === 'cancelling') label = 'Cancelling before the next step…';
    else if (S.status === 'waiting') { label = S.notice ? S.notice.message : 'Waiting for you'; shim = false; }
    else if (L) { label = L.label; icon = L.icon; }
    else label = 'Thinking';
    nowRow = `<div class="now">${ico(icon)}<span class="label ${shim ? 'shimmer' : ''}">${esc(label)}</span><span class="timer" data-timer>${clock(runMs())}</span></div>`;
  }

  const segs = S.steps.length
    ? S.steps.map((s, i) => `<div class="seg ${s.end == null && running ? 'live' : ''} ${s.ok === false ? 'fail' : ''}" data-i="${i}"></div>`).join('')
    : '<div class="seg" style="flex-grow:1"></div>';

  const recent = done.slice().reverse().slice(0, 3);
  const hist = recent.map((s) => `<li data-i="${S.steps.indexOf(s)}">${ico(s.icon, 'sm')}<span class="l">${esc(s.label)}</span>${s.ok === false ? '<span class="x">failed</span>' : ''}<span class="d">${dur(stepMs(s))}</span></li>`).join('');

  const paused = S.status === 'paused' || S.status === 'pausing';
  const controls = running ? `
      <button class="btn" data-act="${paused ? 'resume' : 'pause'}">${paused ? ICONS.play + 'Resume' : ICONS.pause + 'Pause'}</button>
      <button class="btn" data-act="cancel" ${S.status === 'cancelling' ? 'disabled' : ''}>${ICONS.x}Cancel</button>` : '';

  return `
    <div class="head">
      <span class="logo ${running && !paused ? 'spin' : ''}">${ICONS.claude}</span>
      <div class="titles"><div class="model">${esc(S.model)}</div><div class="sub" title="${subline()}">${subline()}</div></div>
      ${S.cost != null ? `<span class="cost" data-cost>${costHTML(shownCost)}</span>` : ''}
      <span class="pill ${S.status}"><i></i>${STATUS[S.status] || S.status}</span>
      <button class="iconbtn" data-collapse title="Collapse">${ICONS.collapse}</button>
    </div>
    ${nowRow}
    <div class="bar ${S.steps.length ? '' : 'empty'}">${segs}</div>
    <ul class="hist">${hist}</ul>
    <div class="foot">${controls}<span class="sp"></span>
      <span class="count">${done.length}/${S.steps.length}</span>
      <button class="log" data-log>Log ${ICONS.arrow}</button>
    </div>
    <div class="tip" id="tip"></div>`;
}

function miniHTML() {
  const recent = S.steps.slice(-4);
  const L = live();
  const color = { finished: 'var(--green)', cancelled: 'var(--red)', failed: 'var(--red)', paused: 'var(--amber)', waiting: 'var(--amber)', interrupted: 'var(--amber)' }[S.status] || 'var(--blue)';
  return `<div class="mini" title="Expand">
      <span class="logo ${L ? 'spin' : ''}">${ICONS.claude}</span>
      <span class="model">${esc(S.model || 'Claude')}</span>
      <span class="stack">${recent.map((s) => `<span class="ico ${s === L ? '' : 'old'}" data-i="${S.steps.indexOf(s)}">${ICONS[s.icon] || ICONS.tool}</span>`).join('')}</span>
      <span class="timer" data-timer>${clock(runMs())}</span>
      <span class="dot" style="background:${color}"></span>
    </div><div class="tip" id="tip"></div>`;
}

function showTip(el, i) {
  const s = S.steps[i]; const tip = $('#tip'); if (!s || !tip) return;
  const card = $('#card').getBoundingClientRect(), r = el.getBoundingClientRect();
  tip.innerHTML = `<b>${esc(s.label)}</b><span>${esc(s.source || s.tool)} · <span data-tipdur="${i}">${dur(stepMs(s))}</span>${s.ok === false ? ' · failed' : ''}</span>`;
  tip.style.left = (r.left + r.width / 2 - card.left) + 'px';
  tip.style.top = (r.top - card.top) + 'px';
  tip.classList.add('on');
}
function hideTip() { const t = $('#tip'); if (t) t.classList.remove('on'); }
function highlight(i, on) {
  document.querySelectorAll(`[data-i="${i}"]`).forEach((n) => n.classList.toggle('hl', on));
}

function bind() {
  const card = $('#card');
  card.querySelectorAll('.seg[data-i], .stack .ico, .hist li').forEach((el) => {
    const i = +el.dataset.i;
    el.addEventListener('mouseenter', () => { highlight(i, true); if (!el.matches('.hist li')) showTip(el, i); });
    el.addEventListener('mouseleave', () => { highlight(i, false); hideTip(); });
  });
  card.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', async (e) => {
    e.stopPropagation(); b.disabled = true;
    await fetch('/api/control', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ session: S.session, action: b.dataset.act }) });
  }));
  const c = card.querySelector('[data-collapse]');
  if (c) c.addEventListener('click', (e) => { e.stopPropagation(); setCollapsed(true); });
  const l = card.querySelector('[data-log]');
  if (l) l.addEventListener('click', openLog);
}
$('#card').addEventListener('click', () => { if (collapsed) setCollapsed(false); });
function setCollapsed(v) { collapsed = v; store.set('am.collapsed', v ? '1' : '0'); render(); }

function openLog() {
  const t0 = S.startedAt || 0;
  $('#panel').innerHTML = `<h2>Run log <button class="iconbtn" data-close>${ICONS.x}</button></h2>
    <div class="prompt">${esc(S.prompt || '')}</div>
    ${S.steps.map((s) => `<div class="row"><span class="t">+${clock(s.start - t0)}</span>${ico(s.icon, 'sm')}<span class="l" title="${esc(s.label)}">${esc(s.label)}${s.error ? `<div class="err">${esc(s.error)}</div>` : ''}</span><span class="t" style="text-align:right">${s.end ? dur(s.end - s.start) : '…'}</span></div>`).join('') || '<div class="row">No tool calls yet.</div>'}
    <div style="margin-top:12px"><a href="/api/log?session=${encodeURIComponent(S.session || '')}" target="_blank">Raw event log ↗</a></div>`;
  $('#drawer').classList.add('on');
  $('#panel [data-close]').addEventListener('click', () => $('#drawer').classList.remove('on'));
}
$('#drawer').addEventListener('click', (e) => { if (e.target.id === 'drawer') e.currentTarget.classList.remove('on'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#drawer').classList.remove('on'); });

function tick() {
  if (!S) return;
  const t = document.querySelector('[data-timer]');
  if (t) t.textContent = clock(runMs());
  // Segment widths follow each step's duration; the live one grows.
  document.querySelectorAll('.seg[data-i]').forEach((el) => {
    const s = S.steps[+el.dataset.i];
    el.style.flexGrow = (0.6 + Math.sqrt(stepMs(s) / 1000)).toFixed(2); // sqrt keeps quick steps visible
  });
  document.querySelectorAll('[data-tipdur]').forEach((el) => { el.textContent = dur(stepMs(S.steps[+el.dataset.tipdur])); });
  // Cost counter eases toward the latest figure.
  if (costTo !== shownCost) {
    const k = Math.min(1, (performance.now() - costT0) / 700);
    shownCost = costFrom + (costTo - costFrom) * (1 - Math.pow(1 - k, 3));
    if (k >= 1) shownCost = costTo;
    const c = document.querySelector('[data-cost]');
    if (c) c.innerHTML = costHTML(shownCost);
  }
}
(function loop() { tick(); requestAnimationFrame(loop); })();

$('#brandlogo').innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14">${ICONS.claude.replace(/^<svg[^>]*>|<\/svg>$/g, '')}</svg>`;
$('#sessions').addEventListener('change', (e) => { chosen = e.target.value; connect(); });
$('#theme').addEventListener('click', () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; store.set('am.theme', next);
});
const savedTheme = store.get('am.theme'); if (savedTheme) document.documentElement.dataset.theme = savedTheme;

connect();
loadSessions();
setInterval(loadSessions, 5000);
</script>
</body>
</html>
